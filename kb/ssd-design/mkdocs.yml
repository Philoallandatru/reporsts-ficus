site_name: SSD 固件与硬件设计知识库
site_description: SSD controller, firmware, FTL, NAND, reliability and verification knowledge base.
docs_dir: .
use_directory_urls: false

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 首页: README.md
  - Wiki:
      - 入口: wiki/index.md
      - SSD 系统架构: wiki/concepts/ssd-system-architecture.md
