standards_version_pins:
  id: STANDARDS-VERSION-PINS
  title: SSD/NVMe/PCIe/NAND standards version and access-condition pins
  query_date: 2026-08-12
  purpose:
    - Fix the standards version targets used by this SSD design knowledge base.
    - Record which sources are public, account-gated, member-gated or manually verified only.
    - Separate "version identified" from "PDF downloaded and sha256 verified".
  status_levels:
    - id: pinned_version
      description: Version/revision is identified from an official source, but local file/hash may still be pending.
    - id: access_restricted
      description: Official entry exists, but download requires account, membership, purchase or license acceptance.
    - id: manual_verification_needed
      description: Official entry is known, but this environment could not fully verify details automatically.
    - id: hash_pending
      description: Version is identified, but PDF filename and sha256 have not yet been recorded.
  standards:
