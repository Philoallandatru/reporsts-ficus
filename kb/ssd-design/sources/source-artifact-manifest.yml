source_artifact_manifest:
  id: SOURCE-ARTIFACT-MANIFEST
  title: SSD knowledge-base source artifact download and hash manifest
  query_date: 2026-08-12
  purpose:
    - Track which source artifacts may be downloaded, which are gated, and which are only cited by official URL.
    - Record local filenames and sha256 values before any PDF or archive is used as design evidence.
    - Keep copyrighted or license-restricted standards out of the repository unless redistribution is explicitly allowed.
  artifact_root: sources/artifacts
  status_levels:
    - id: planned_download
      description: Official URL is known and artifact appears publicly downloadable, but local file/hash are not recorded yet.
    - id: manual_download_required
      description: Official URL exists, but the site requires browser clickthrough, JavaScript, account flow, or manual license review.
    - id: restricted_reference_only
      description: Official source is restricted; keep URL and access condition only.
    - id: downloaded_hash_verified
      description: Local file exists under artifact_root and sha256 matches this manifest.
  verification_rules:
    - A record with status downloaded_hash_verified must have local_file and sha256 populated.
    - local_file paths are relative to artifact_root.
    - Do not store PCI-SIG, JEDEC, member-gated, purchased or NDA materials unless repository policy explicitly permits it.
    - For public standards with clickthrough terms, record the exact download date and terms note before committing a file.
